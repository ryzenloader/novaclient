name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Introspect and Build
        run: |
          gradle --no-daemon compileJava || true
          find /home/runner/.gradle/caches/fabric-loom/ -name '*.jar' | while read jar; do
            jar tf "$jar" | grep -iE 'ClickType|handleInventory' || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaclient
          path: build/libs/*.jar
